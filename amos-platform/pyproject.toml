[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amos-simulation-platform"
version = "3.0.0"
description = "AMOS causal scenario simulator and A2A integration display"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0,<4.0",
    "waitress>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
]

[project.scripts]
amos-platform = "amos_platform.api.app_factory:main"
amos-platform-smoke = "amos_platform.api.offline_smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
