<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#07151f"/><text x="65" y="78" fill="#eefbff" font-family="sans-serif" font-size="38" font-weight="700">任务闭环与资源回收</text>
  <g font-family="sans-serif" font-size="25"><rect x="90" y="155" width="620" height="590" rx="24" fill="#102b38" stroke="#5edfff" stroke-width="3"/><text x="140" y="220" fill="#eafaff">分批回收资源</text><text x="140" y="285" fill="#9cd4e3">UAV-ISR-01　完成双目标评估后回收</text><text x="140" y="345" fill="#9cd4e3">UAV-STRIKE-01　完成雷达车打击后回收</text><text x="140" y="405" fill="#9cd4e3">AEW-01　保持指挥至最后返航</text><text x="140" y="500" fill="#8ce9b8">机场与雷达车分别核对命中记录</text><text x="140" y="550" fill="#8ce9b8">民用港区未纳入任何交战</text><text x="140" y="600" fill="#8ce9b8">可回收航空器回收后编队撤离</text>
  <rect x="890" y="155" width="620" height="590" rx="24" fill="#2b1b18" stroke="#ff9e55" stroke-width="3"/><text x="940" y="220" fill="#fff0e7">一次性攻击资源</text><text x="940" y="285" fill="#ffd0ae">UAV-ONEWAY-01</text><text x="940" y="350" fill="#ffd0ae">只攻击已分配的机场目标</text><text x="940" y="410" fill="#ffd0ae">授权攻击后转为“已消耗资源”</text><text x="940" y="510" fill="#ffb784">未获授权或目标进入保护区：</text><text x="940" y="555" fill="#ffb784">保持安全航路 → 中止任务</text></g>
  <path d="M710 450H890" stroke="#6adfff" stroke-width="5" stroke-dasharray="12 10"/><circle cx="800" cy="450" r="16" fill="#08151f" stroke="#6adfff" stroke-width="4"/><text x="800" y="825" fill="#a9cbd5" font-family="sans-serif" font-size="23" text-anchor="middle">所有结果以当前传感器证据和实际仿真事件为准</text>
</svg>
