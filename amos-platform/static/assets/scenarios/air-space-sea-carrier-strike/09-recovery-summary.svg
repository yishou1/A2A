<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#07151f"/><text x="65" y="78" fill="#eefbff" font-family="sans-serif" font-size="38" font-weight="700">任务闭环与资源回收</text>
  <g font-family="sans-serif" font-size="25"><rect x="90" y="155" width="620" height="590" rx="24" fill="#102b38" stroke="#5edfff" stroke-width="3"/><text x="140" y="220" fill="#eafaff">分批回收资源</text><text x="140" y="285" fill="#9cd4e3">UAV-ISR-01　完成毁伤评估后优先回收</text><text x="140" y="345" fill="#9cd4e3">UAV-STRIKE-01　完成武器释放后回收</text><text x="140" y="405" fill="#9cd4e3">UAV-TANKER-01　保障最后无人机回收窗口</text><text x="140" y="450" fill="#9cd4e3">AEW-01　保持指挥至最后返航</text><text x="140" y="535" fill="#8ce9b8">民用港区未纳入任何交战或毁伤评估</text><text x="140" y="580" fill="#8ce9b8">航空器回收完成后编队撤离</text>
  <rect x="890" y="155" width="620" height="590" rx="24" fill="#2b1b18" stroke="#ff9e55" stroke-width="3"/><text x="940" y="220" fill="#fff0e7">一次性空射载荷</text><text x="940" y="285" fill="#ffd0ae">LOITER-UAV-01</text><text x="940" y="350" fill="#ffd0ae">仅在岸防单元持续确认后实施末端攻击</text><text x="940" y="410" fill="#ffd0ae">攻击后转为“已消耗武器”</text><text x="940" y="510" fill="#ffb784">未获授权或目标进入保护区：</text><text x="940" y="555" fill="#ffb784">安全巡飞 → 预设处置区中止任务</text></g>
  <path d="M710 450H890" stroke="#6adfff" stroke-width="5" stroke-dasharray="12 10"/><circle cx="800" cy="450" r="16" fill="#08151f" stroke="#6adfff" stroke-width="4"/><text x="800" y="825" fill="#a9cbd5" font-family="sans-serif" font-size="23" text-anchor="middle">所有结果以当前传感器证据和实际仿真事件为准</text>
</svg>
