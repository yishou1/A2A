algorithm_id: battlefield_rtdetr_detector
version: 1.0.0
display_name: Battlefield RT-DETR Detector
backend_type: python_http_service
status: draft

task_family: detection
modalities:
  input:
    - structured_json
  output:
    - structured_json

capabilities:
  - object_detection
  - rt_detr
  - odconv

agent_card:
  summary: >
    Battlefield RT-DETR Detector from the TIA tactical intelligence agent pipeline.
  when_to_use:
    - EO/IR or SAR visual frames need battlefield object detection.
  when_not_to_use:
    - Only unstructured text without imagery is available.
  input_description: >
    See input.schema.json for required structured fields.
  output_description: >
    See output.schema.json for structured outputs.

machine_spec:
  input_schema_ref: input.schema.json
  output_schema_ref: output.schema.json
  runtime:
    backend_type: python_http_service
    endpoint: http://127.0.0.1:9020/predict
    health_endpoint: http://127.0.0.1:9020/health
    metadata_endpoint: http://127.0.0.1:9020/metadata
    timeout_ms: 15000

constraints:
  max_input_chars: 20000000
  max_request_bytes: 33554432
  batch_supported: false
  streaming_supported: false

performance:
  latency_ms_p50: 50
  latency_ms_p95: 500
  primary_metric: detection_map
  primary_score: 0.75

resource_requirements:
  min_cpu_cores: 2
  recommended_cpu_cores: 4
  min_memory_mb: 4096
  recommended_memory_mb: 8192
  min_gpu_count: 0
  gpu_type: optional
  min_vram_mb: 0
  recommended_vram_mb: 8192
  disk_mb: 4096

model_profile:
  parameter_count: 32970476
  parameter_count_text: "32,970,476 FP32 parameters measured from local Ultralytics RT-DETR-L checkpoint rtdetr-l.pt (SHA256 6de60b10d4bc566f00cda0f5b4d64afe4b66d48dc9695d2171effb7859d8e73f); a future trained ODConv refiner would add 24,361 parameters, for 32,994,837 total pipeline parameters"
  flops: 109567162064
  flops_text: "PyTorch-profiler lower-bound RT-DETR-L base FLOPs at batch=1: 49,105,653,803 for [1,3,416,416], 109,567,162,064 for [1,3,640,640] (this field), and 425,411,332,064 for [1,3,1280,1280]. With a trained ODConv refiner, total pipeline FLOPs are base plus valid_detection_count times 25,298,179 / 44,967,171 / 70,255,875 for crop sizes 96 / 128 / 160. Values exclude preprocessing and NMS; the 416 RT-DETR-L value is a size reference only because small profile selects rtdetr-n, while current medium/large trained checkpoints are absent"
  flops_input_shape: [1, 3, 640, 640]
  model_size_mb: 64
  precision: fp32
safety:
  risk_level: medium
  requires_human_review: true
