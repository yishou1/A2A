algorithm_id: motr_neural_kalman_tracker
version: 1.0.0
display_name: MOTR Neural Kalman Tracker
backend_type: python_http_service
status: draft

task_family: tracking
modalities:
  input:
    - structured_json
  output:
    - structured_json

capabilities:
  - multi_object_tracking
  - geolocation

agent_card:
  summary: >
    MOTR Neural Kalman Tracker from the TIA tactical intelligence agent pipeline.
  when_to_use:
    - Verified detections need persistent tracks and geo estimation.
  when_not_to_use:
    - No verified detections are available.
  input_description: >
    See input.schema.json for required structured fields.
  output_description: >
    See output.schema.json for structured outputs.

machine_spec:
  input_schema_ref: input.schema.json
  output_schema_ref: output.schema.json
  runtime:
    backend_type: python_http_service
    endpoint: http://127.0.0.1:9023/predict
    health_endpoint: http://127.0.0.1:9023/health
    metadata_endpoint: http://127.0.0.1:9023/metadata
    timeout_ms: 8000

constraints:
  max_input_chars: 20000000
  max_request_bytes: 33554432
  batch_supported: false
  streaming_supported: false

performance:
  latency_ms_p50: 50
  latency_ms_p95: 500
  primary_metric: track_continuity
  primary_score: 0.83

resource_requirements:
  min_cpu_cores: 2
  recommended_cpu_cores: 4
  min_memory_mb: 4096
  recommended_memory_mb: 8192
  min_gpu_count: 0
  gpu_type: optional
  min_vram_mb: 0
  recommended_vram_mb: 8192
  disk_mb: 4096

model_profile:
  parameter_count: 12443206
  parameter_count_text: "12,443,206 architecture parameters for the MOTR-style tracker: 11,176,512 headless torchvision ResNet18 parameters plus projection, Transformer association, and KalmanNet. This is an architecture reference only because the configured trained MOTR checkpoint is absent"
  flops: 1337423572
  flops_text: "1,337,423,572 architecture-profiler lower-bound FLOPs for one current and one prior [1,3,96,96] crop, one association pair, and one Kalman update; runtime work scales with detections and prior tracks. It does not certify a trained checkpoint"
  flops_input_shape: [1, 3, 96, 96]
  precision: fp32_architecture_reference

safety:
  risk_level: medium
  requires_human_review: true
