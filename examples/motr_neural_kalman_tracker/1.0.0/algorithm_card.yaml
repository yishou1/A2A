algorithm_id: motr_neural_kalman_tracker
version: 1.0.0
display_name: MOTR Neural Kalman Tracker
backend_type: python_http_service
status: draft

task_family: tracking
modalities:
  input:
    - structured_json
  output:
    - structured_json

capabilities:
  - multi_object_tracking
  - geolocation

agent_card:
  summary: >
    MOTR Neural Kalman Tracker from the TIA tactical intelligence agent pipeline.
  when_to_use:
    - Verified detections need persistent tracks and geo estimation.
  when_not_to_use:
    - No verified detections are available.
  input_description: >
    See input.schema.json for required structured fields.
  output_description: >
    See output.schema.json for structured outputs.

machine_spec:
  input_schema_ref: input.schema.json
  output_schema_ref: output.schema.json
  runtime:
    backend_type: python_http_service
    endpoint: http://127.0.0.1:9023/predict
    health_endpoint: http://127.0.0.1:9023/health
    metadata_endpoint: http://127.0.0.1:9023/metadata
    timeout_ms: 8000

constraints:
  max_input_chars: 20000000
  max_request_bytes: 33554432
  batch_supported: false
  streaming_supported: false

performance:
  latency_ms_p50: 50
  latency_ms_p95: 500
  primary_metric: track_continuity
  primary_score: 0.83

resource_requirements:
  min_cpu_cores: 2
  recommended_cpu_cores: 4
  min_memory_mb: 4096
  recommended_memory_mb: 8192
  min_gpu_count: 0
  gpu_type: optional
  min_vram_mb: 0
  recommended_vram_mb: 8192
  disk_mb: 4096

model_profile:
  # MOTRCostNet: ResNet18 backbone (11,689,512) + Linear(512->128)=65,664
  #   + TransformerEncoder 2L(d_model=128,nhead=4,ffn=512): ~263K x2 = ~526K
  #   SubTotal: ~12,281K
  # KalmanNet: GRU(input=10,hidden=64)=14,400 + Linear(64->6)=390 = 14,790
  # Total: ~12,296K (~12.3M)
  parameter_count: 12296000
  parameter_count_text: 12.3M (MOTRCostNet ResNet18+Transformer + KalmanNet GRU)
  flops: 1800000000
  flops_text: ~1.8 GFLOPs per frame @ 224×224 crop (ResNet18 backbone)
  flops_input_shape: [1, 3, 224, 224]
  model_size_mb: 48
  precision: fp32

safety:
  risk_level: medium
  requires_human_review: true
