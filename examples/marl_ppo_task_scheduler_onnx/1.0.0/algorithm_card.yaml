algorithm_id: marl_ppo_task_scheduler_onnx
version: 1.0.0
display_name: MARL-PPO Task Scheduler ONNX
backend_type: onnx
status: draft

task_family: planning
modalities:
  input:
    - structured_json
  output:
    - structured_json

capabilities:
  - task_scheduling
  - marl_ppo
  - onnx

agent_card:
  summary: >
    Native ONNX MARL-PPO actor/critic core for one agent observation.
  when_to_use:
    - Caller already built one agent observation vector from BattlefieldSchedulingEnv.
    - Need action logits / value without Python HTTP.
  when_not_to_use:
    - Need full multi-agent assignment decoding into sensor/strike plans.
    - Use marl_ppo_task_scheduler python service for end-to-end scheduling.
  input_description: >
    obs [1,102] from BattlefieldSchedulingEnv.build_agent_obs.
  output_description: >
    action_logits [1,9], value [1,1].

machine_spec:
  input_schema_ref: input.schema.json
  output_schema_ref: output.schema.json
  tensor_contract_ref: tensor_contract.yaml
  runtime:
    backend_type: onnx
    model_uri: model.onnx
    execution_provider: cpu
  preprocess:
    config_uri: preprocess.yaml
  postprocess:
    config_uri: postprocess.yaml

constraints:
  max_input_chars: 2000000
  max_request_bytes: 33554432
  batch_supported: false
  streaming_supported: false

performance:
  latency_ms_p50: 5
  latency_ms_p95: 30
  primary_metric: onnx_native_inference
  primary_score: 1.0
  time_complexity: O(n)
  space_complexity: O(n)
  complexity_variable: [1, 102]
  performance_notes: >
    Native CPU ONNX Runtime inference for the model core only. Feature
    construction / orchestration remains in the python_http_service sibling.

resource_requirements:
  min_cpu_cores: 1
  recommended_cpu_cores: 2
  min_memory_mb: 256
  recommended_memory_mb: 1024
  min_gpu_count: 0
  gpu_type: none
  min_vram_mb: 0
  recommended_vram_mb: 0
  disk_mb: 64

model_profile:
  parameter_count: 39178
  parameter_count_text: "39178"
  flops: 0
  flops_text: shared encoder + actor/critic
  flops_input_shape: [1, 102]
  model_size_mb: 1
  precision: fp32

safety:
  risk_level: medium
  requires_human_review: true
