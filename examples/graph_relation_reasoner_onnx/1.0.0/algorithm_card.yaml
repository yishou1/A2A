algorithm_id: graph_relation_reasoner_onnx
version: 1.0.0
display_name: Graph Relation Reasoner ONNX
backend_type: onnx
status: validated
algorithm_class: M20

task_family: graph_reasoning
modalities:
  input: [graph_tensors, numeric_features]
  output: [structured_json]

capabilities:
  - graph_relation_reasoner
  - group_relation_reasoning
  - formation_relation_scoring
  - batch_inference
  - lightweight_onnx_inference

agent_card:
  summary: Native ONNX Runtime variant of the trained M20 dense message-passing graph neural network.
  when_to_use:
    - Normalized node and edge tensors are available for graphs of at most 10 nodes.
    - Portable pairwise formation-relation scores are required.
  when_not_to_use:
    - Raw tracks still need geographic feature construction.
    - Pair labels, thresholds, or connected-component group objects must be generated automatically.
  input_description: Padded node features, edge features, and node masks for ten-node graphs.
  output_description: Symmetric relation logits and sigmoid probabilities for every node pair.

machine_spec:
  input_schema_ref: input.schema.json
  output_schema_ref: output.schema.json
  tensor_contract_ref: tensor_contract.yaml
  runtime:
    backend_type: onnx
    model_uri: model.onnx
    execution_provider: cpu
  preprocess:
    config_uri: preprocess.yaml
  postprocess:
    config_uri: postprocess.yaml

constraints:
  max_input_chars: 10000000
  max_request_bytes: 16777216
  batch_supported: true
  streaming_supported: false

performance:
  latency_ms_p50: 3
  latency_ms_p95: 15
  primary_metric: synthetic_holdout_edge_f1
  primary_score: 0.962788
  time_complexity: O(B*N^2*H^2)
  space_complexity: O(B*N^2*H)
  complexity_variable: B=batch rows, N=10 nodes, H=32 hidden dimensions
  performance_notes: Reference metrics use deterministic synthetic formation graphs.

resource_requirements:
  min_cpu_cores: 1
  recommended_cpu_cores: 1
  min_memory_mb: 128
  recommended_memory_mb: 256
  min_gpu_count: 0
  gpu_type: none
  min_vram_mb: 0
  recommended_vram_mb: 0
  disk_mb: 1

model_profile:
  parameter_count: 16673
  parameter_count_text: 16673_trainable_parameters
  flops: 1000000
  flops_text: approximate dense ten-node pairwise message-passing operations
  flops_input_shape: [1, 10, 7]
  model_size_mb: 1
  precision: fp32

provenance:
  model_artifact_ref: model.onnx
  model_metadata_ref: model.metadata.json
  training_script_ref: ../../../scripts/train_graph_relation_gnn.py
  dataset_ref: ../../../data/graph_relation_gnn/reference_holdout_nodes.npy

safety:
  risk_level: low
  requires_human_review: true
