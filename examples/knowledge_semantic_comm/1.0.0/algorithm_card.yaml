algorithm_id: knowledge_semantic_comm
version: 1.0.0
display_name: Knowledge Semantic Comm
backend_type: python_http_service
status: draft

task_family: generation
modalities:
  input:
    - structured_json
  output:
    - structured_json

capabilities:
  - semantic_compression
  - intelligence_summary

agent_card:
  summary: >
    Knowledge Semantic Comm from the TIA tactical intelligence agent pipeline.
  when_to_use:
    - Perception and cognition outputs need semantic packet compression.
  when_not_to_use:
    - Neither perception nor cognition payloads are available.
  input_description: >
    See input.schema.json for required structured fields.
  output_description: >
    See output.schema.json for structured outputs.

machine_spec:
  input_schema_ref: input.schema.json
  output_schema_ref: output.schema.json
  runtime:
    backend_type: python_http_service
    endpoint: http://127.0.0.1:9029/predict
    health_endpoint: http://127.0.0.1:9029/health
    metadata_endpoint: http://127.0.0.1:9029/metadata
    timeout_ms: 10000

constraints:
  max_input_chars: 20000000
  max_request_bytes: 33554432
  batch_supported: false
  streaming_supported: false

performance:
  latency_ms_p50: 50
  latency_ms_p95: 500
  primary_metric: compression_ratio
  primary_score: 0.79

resource_requirements:
  min_cpu_cores: 2
  recommended_cpu_cores: 4
  min_memory_mb: 4096
  recommended_memory_mb: 8192
  min_gpu_count: 0
  gpu_type: optional
  min_vram_mb: 0
  recommended_vram_mb: 8192
  disk_mb: 4096

model_profile:
  parameter_count: 76961152
  parameter_count_text: "76,961,152 parameters for default external google/flan-t5-small reference config (snapshot 0fc9ddf78a1e988dac52e2dac162b0ede4fd74ab); large profile selects google/flan-t5-base with 247,577,856 parameters. External weights and revisions are not pinned locally"
  flops: 7912478479
  flops_text: "7,912,478,479 architecture-profiler lower-bound FLOPs for FLAN-T5 Small reference generation with batch=1, 128 input tokens, 8 generated tokens, and 2 beams; actual service cost varies up to 512 input tokens and 64 generated tokens and includes a second encoder pass. FLAN-T5 Base is 33,665,160,647 FLOPs under the same reference generation"
  flops_input_shape: [1, 128]
  precision: fp32_reference_external_weights

safety:
  risk_level: medium
  requires_human_review: true
