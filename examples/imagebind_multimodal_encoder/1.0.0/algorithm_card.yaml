algorithm_id: imagebind_multimodal_encoder
version: 1.0.0
display_name: ImageBind Multimodal Encoder
backend_type: python_http_service
status: draft

task_family: embedding
modalities:
  input:
    - structured_json
  output:
    - structured_json

capabilities:
  - multimodal_embedding
  - cross_modal_encoding

agent_card:
  summary: >
    ImageBind Multimodal Encoder from the TIA tactical intelligence agent pipeline.
  when_to_use:
    - Multiple sensor modalities need unified embeddings.
  when_not_to_use:
    - No sensor frames are provided.
  input_description: >
    See input.schema.json for required structured fields.
  output_description: >
    See output.schema.json for structured outputs.

machine_spec:
  input_schema_ref: input.schema.json
  output_schema_ref: output.schema.json
  runtime:
    backend_type: python_http_service
    endpoint: http://127.0.0.1:9025/predict
    health_endpoint: http://127.0.0.1:9025/health
    metadata_endpoint: http://127.0.0.1:9025/metadata
    timeout_ms: 10000

constraints:
  max_input_chars: 20000000
  max_request_bytes: 33554432
  batch_supported: false
  streaming_supported: false

performance:
  latency_ms_p50: 50
  latency_ms_p95: 500
  primary_metric: embedding_quality
  primary_score: 0.86

resource_requirements:
  min_cpu_cores: 2
  recommended_cpu_cores: 4
  min_memory_mb: 4096
  recommended_memory_mb: 8192
  min_gpu_count: 0
  gpu_type: optional
  min_vram_mb: 0
  recommended_vram_mb: 8192
  disk_mb: 4096

model_profile:
  parameter_count: 1200781057
  parameter_count_text: "1,200,781,057 total parameters for Meta ImageBind imagebind_huge reference architecture; the visual path actively uses 632,829,440 parameters. If the imagebind package is unavailable, this service falls back to external openai/clip-vit-base-patch32 (151,277,313 total; 87,849,216 vision-plus-projection parameters)"
  flops: 323404842240
  flops_text: "323,404,842,240 architecture-profiler lower-bound FLOPs for ImageBind Huge visual embedding at [1,3,224,224]; external source weights are not pinned locally. CLIP ViT-B/32 fallback visual embedding is 8,730,109,440 FLOPs at the same input; text and other modality paths use different token-dependent costs"
  flops_input_shape: [1, 3, 224, 224]
  precision: fp32_reference_external_weights

safety:
  risk_level: low
  requires_human_review: true
