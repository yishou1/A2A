algorithm_id: marl_dynamic_router_onnx
version: 1.0.0
display_name: MARL Dynamic Router ONNX
backend_type: onnx
status: draft

task_family: routing
modalities:
  input:
    - structured_json
  output:
    - structured_json

capabilities:
  - channel_selection
  - anti_jam
  - onnx

agent_card:
  summary: >
    Native ONNX MARL routing policy: channel logits + reliability.
  when_to_use:
    - Caller already built the 8-dim routing state vector.
  when_not_to_use:
    - Need per-subscriber route list construction (use marl_dynamic_router service).
  input_description: >
    state [1,8]: jamming, target_density, high_threat_ratio, agent_density, compression, jam_flag, semantic_len, bias.
  output_description: >
    channel_logits [1,3] ordered ['semantic_rf', 'fhss_backup', 'satcom_relay']; reliability [1,1].

machine_spec:
  input_schema_ref: input.schema.json
  output_schema_ref: output.schema.json
  tensor_contract_ref: tensor_contract.yaml
  runtime:
    backend_type: onnx
    model_uri: model.onnx
    execution_provider: cpu
  preprocess:
    config_uri: preprocess.yaml
  postprocess:
    config_uri: postprocess.yaml

constraints:
  max_input_chars: 2000000
  max_request_bytes: 33554432
  batch_supported: false
  streaming_supported: false

performance:
  latency_ms_p50: 5
  latency_ms_p95: 30
  primary_metric: onnx_native_inference
  primary_score: 1.0
  time_complexity: O(n)
  space_complexity: O(n)
  complexity_variable: [1, 8]
  performance_notes: >
    Native CPU ONNX Runtime inference for the model core only. Feature
    construction / orchestration remains in the python_http_service sibling.

resource_requirements:
  min_cpu_cores: 1
  recommended_cpu_cores: 2
  min_memory_mb: 256
  recommended_memory_mb: 1024
  min_gpu_count: 0
  gpu_type: none
  min_vram_mb: 0
  recommended_vram_mb: 0
  disk_mb: 64

model_profile:
  parameter_count: 4996
  parameter_count_text: "4996"
  flops: 0
  flops_text: small MLP policy
  flops_input_shape: [1, 8]
  model_size_mb: 1
  precision: fp32

safety:
  risk_level: medium
  requires_human_review: true
