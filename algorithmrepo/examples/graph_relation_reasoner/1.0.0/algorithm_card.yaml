algorithm_id: graph_relation_reasoner
version: 1.0.0
display_name: Graph Relation Reasoner
backend_type: python_http_service
status: validated
algorithm_class: M20
algorithm_class_name: 图神经网络
owner_scope: track_threat_agent

task_family: graph_reasoning
modalities:
  input:
    - structured_json
  output:
    - structured_json

capabilities:
  - graph_relation_reasoner
  - spatiotemporal_graph_builder
  - group_relation_reasoning
  - formation_group_detection

agent_card:
  summary: >
    M20 package for the Track Threat Agent. Uses a trained dense message-passing
    graph neural network to infer pairwise formation relations and connected groups.
  when_to_use:
    - Multi-target tracks need graph relations or formation/group candidates.
  when_not_to_use:
    - Knowledge-graph/RAG semantic reasoning or production-grade intelligence conclusions are required.
  input_description: >
    tracks with lat/lon/speed/heading/object_type.
  output_description: >
    relations, connected groups, and graph summary.

machine_spec:
  input_schema_ref: input.schema.json
  output_schema_ref: output.schema.json
  runtime:
    backend_type: python_http_service
    endpoint: http://127.0.0.1:9022/graph_relation_reasoner/predict
    health_endpoint: http://127.0.0.1:9022/graph_relation_reasoner/health
    metadata_endpoint: http://127.0.0.1:9022/graph_relation_reasoner/metadata
    timeout_ms: 3000

constraints:
  max_input_chars: 500000
  max_request_bytes: 2097152
  batch_supported: true
  streaming_supported: false

performance:
  latency_ms_p50: 20
  latency_ms_p95: 120
  primary_metric: synthetic_holdout_edge_f1
  primary_score: 0.962788
  performance_notes: >
    On 600 independent deterministic synthetic formation graphs, edge accuracy
    was 0.992088, F1 0.962788 and ROC AUC 0.999212. The prior distance/motion
    rule baseline achieved F1 0.912402 and ROC AUC 0.936968.

resource_requirements:
  min_cpu_cores: 1
  recommended_cpu_cores: 2
  min_memory_mb: 512
  recommended_memory_mb: 1024
  min_gpu_count: 0
  gpu_type: optional
  min_vram_mb: 0
  recommended_vram_mb: 0
  disk_mb: 10

model_profile:
  parameter_count: 16673
  parameter_count_text: 16.7K dense message-passing GNN parameters
  model_size_mb: 2
  precision: fp32

safety:
  risk_level: low
  requires_human_review: true

provenance:
  model_artifact_ref: ../../../models/checkpoints/graph_relation_gnn_s.safetensors
  model_metadata_ref: ../../../models/checkpoints/graph_relation_gnn_s.metadata.json
  training_script_ref: ../../../scripts/train_graph_relation_gnn.py
  holdout_dataset_ref: ../../../data/graph_relation_gnn/reference_holdout_nodes.npy
