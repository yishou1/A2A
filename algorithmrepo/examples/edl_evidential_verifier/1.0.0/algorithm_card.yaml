algorithm_id: edl_evidential_verifier
version: 1.0.0
display_name: EDL Evidential Verifier
backend_type: python_http_service
status: validated

task_family: scoring
modalities:
  input:
    - structured_json
  output:
    - structured_json

capabilities:
  - evidential_verification
  - uncertainty_estimation

agent_card:
  summary: >
    Trained Dirichlet evidential classifier that reports calibrated verification
    probability, epistemic/aleatoric uncertainty, and a reviewable evidence trace.
  when_to_use:
    - Raw detections need epistemic filtering before tracking.
    - Rejected or ambiguous detections require an auditable explanation and review queue.
  when_not_to_use:
    - No detection candidates are provided.
  input_description: >
    See input.schema.json for required structured fields.
  output_description: >
    All assessments partitioned into verified, rejected, and manual-review lists,
    with feature values, class evidence, Dirichlet strength, decision rules, and model identity.

machine_spec:
  input_schema_ref: input.schema.json
  output_schema_ref: output.schema.json
  runtime:
    backend_type: python_http_service
    endpoint: http://127.0.0.1:9022/predict
    health_endpoint: http://127.0.0.1:9022/health
    metadata_endpoint: http://127.0.0.1:9022/metadata
    timeout_ms: 3000

constraints:
  max_input_chars: 20000000
  max_request_bytes: 33554432
  batch_supported: false
  streaming_supported: false

performance:
  latency_ms_p50: 50
  latency_ms_p95: 500
  primary_metric: synthetic_holdout_macro_f1
  primary_score: 0.90141

resource_requirements:
  min_cpu_cores: 1
  recommended_cpu_cores: 2
  min_memory_mb: 128
  recommended_memory_mb: 256
  min_gpu_count: 0
  gpu_type: optional
  min_vram_mb: 0
  recommended_vram_mb: 0
  disk_mb: 10

model_profile:
  parameter_count: 290
  parameter_count_text: 290_small_profile
  flops: 0
  flops_text: varies_by_submodel
  precision: fp32

provenance:
  model_artifact_ref: ../../../models/checkpoints/edl_head_s.safetensors
  model_metadata_ref: ../../../models/checkpoints/edl_head_s.metadata.json
  training_script_ref: ../../../scripts/train_edl_evidential_verifier.py
  dataset_ref: ../../../data/edl_verifier/reference_holdout.json

safety:
  risk_level: medium
  requires_human_review: true
