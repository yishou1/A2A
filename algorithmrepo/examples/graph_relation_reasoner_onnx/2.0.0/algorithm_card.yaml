algorithm_id: graph_relation_reasoner
version: 2.0.0
display_name: Multi-Platform Temporal Graph Relation Reasoner
backend_type: python_http_service
status: candidate
algorithm_class: M20
algorithm_class_name: 图神经网络
owner_scope: track_threat_agent

task_family: graph_reasoning
modalities:
  input: [structured_json, track_history, type_taxonomy]
  output: [structured_json]

capabilities:
  - graph_relation_reasoner
  - multi_platform_group_relation_scoring
  - type_name_expert_routing
  - temporal_group_relation_inference

agent_card:
  summary: >
    Raw-track M20 service variant. A small type-name ONNX router selects aircraft,
    UAV, ship, or ground-vehicle temporal GRU-GNN expert; the service constructs
    standard graph tensors and returns pair relations and connected groups.
  when_to_use:
    - Tracks provide a stable type name and at least six history observations.
  when_not_to_use:
    - The target is static, type taxonomy is unseen, or history is insufficient.
  input_description: >
    tracks with track_id, lat, lon, speed, heading, history_path, and preferably
    type_name, class_name, or metadata.source_class.
  output_description: >
    formation-membership relations, connected groups, and per-track routing records.

machine_spec:
  input_schema_ref: input.schema.json
  output_schema_ref: output.schema.json
  runtime:
    backend_type: python_http_service
    endpoint: http://127.0.0.1:9038/graph_relation_reasoner/predict
    params:
      model_variant: m20_fused_onnx_v6
    execution_provider: CPUExecutionProvider
    timeout_ms: 3000

model_profile:
  router_parameter_count: 3078
  expert_count: 4
  precision: fp32
  runtime: onnxruntime_cpu

provenance:
  model_bundle_ref: model_bundle
  manifest_ref: model_bundle/manifest.json

safety:
  risk_level: low
  requires_human_review: true
  boundary: Situation-awareness relation analysis only; no weapon control or engagement decision.
